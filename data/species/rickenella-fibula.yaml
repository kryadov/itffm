text:
  ru: >-
    Крошечный оранжевый гвоздик на волосок толщиной — шляпка едва достигает
    сантиметра, а ножка тоньше спички. Растёт только среди настоящего мха,
    прямо из его дерновины, и больше нигде: ни на голой почве, ни на
    древесине. Слишком мал, чтобы собирать, но верный знак, что мох под
    ногами живой и влажный.
  en: >-
    A tiny orange pin barely a centimetre tall, with a stem thinner than a
    matchstick. Grows only out of a living moss cushion, nowhere else — not on
    bare soil, not on wood. Too small to be worth picking, but a reliable sign
    that the moss underfoot is alive and damp.
