id: agaricus-campestris
gbifKey: 5243458
name:
  la: Agaricus campestris
  ru: Шампиньон полевой
  en: Field mushroom
edibility: edible
lookalikes: [amanita-phalloides]
morphology:
  cap:
    shape: hemispherical
    ageShape: flat
    diameter: [30, 100]
    color: "#f5f0e0"
    surface: smooth
    surfaceColor: "#f5f0e0"
  hymenium:
    type: gills
    attachment: free
    color: "#a9748a"
  stipe:
    height: [30, 80]
    width: [8, 15]
    color: "#f0ece0"
    position: central
    ring: fugacious
    volva: none
  flesh:
    color: "#fffdf0"
    bruising: red
  latex: none
ecology:
  mycorrhizal: []
  substrate: soil
  biomes: [meadow-scrub, park-urban]
  season: [6, 7, 8, 9, 10]
