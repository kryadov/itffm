text:
  ru: >-
    Целиком яично-жёлтая, с тупыми вильчатыми складками вместо настоящих
    пластинок, пахнет абрикосом. Ядовитый двойник — говорушка оливковая —
    имеет острые настоящие пластинки и растёт плотными пучками на древесине, а
    не рассеянно на почве. Проверка складок против пластинок — самый надёжный
    способ отличить их.
  en: >-
    Uniformly egg-yolk yellow, with blunt forking ridges rather than true
    gills, and a faint apricot scent. Its poisonous look-alike, the
    jack-o'-lantern, has true sharp-edged gills and grows in dense clusters on
    wood rather than scattered on soil — checking ridges against real gills is
    the surest way to tell them apart.
