text:
  ru: >-
    Ярко-красная, почти лакированная шляпка на белой мякоти, которая ломается,
    как мел, а не гнётся, как у любого другого рода — эту хрупкость разделяют
    все сыроежки. Растёт в самых сырых, замшелых уголках леса, часто прямо во
    мху сфагнума. Вкус резко жгучий (безопасный способ проверить, не
    проглатывая), а само название говорит, к чему приводит употребление в
    пищу.
  en: >-
    A bright, almost lacquered red cap on white flesh that snaps like chalk
    rather than bending, a brittleness shared by every Russula. Grows in the
    wettest, mossiest corners of the wood, often right in the sphagnum. Sharply
    acrid to taste (a safe way to check without swallowing), and eating it
    brings on exactly what the name promises.
