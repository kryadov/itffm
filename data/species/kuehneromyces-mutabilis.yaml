text:
  ru: >-
    Густые пучки на пнях лиственных деревьев. Шляпка медово-рыжая,
    гигрофанная: подсыхая, светлеет от центра, и гриб становится
    двухцветным. Ножка ниже кольца покрыта мелкими торчащими чешуйками —
    «сапожок». Съедобен и вкусен, но опасно похож на смертельно ядовитую
    галерину окаймлённую, растущую на тех же пнях: у той ножка ниже кольца
    гладкая, волокнистая, и подсыхает она с края. Собирать только тем, кто
    уверенно их различает.
  en: >-
    Dense tufts on the stumps of broadleaved trees. The cap is honey-orange
    and hygrophanous: it pales from the centre as it dries, so the mushroom
    turns two-toned. Below the ring the stem is covered in small shaggy scales
    — the "sheath". Edible and good, but dangerously like the deadly funeral
    bell on the same stumps, whose stem below the ring is silky rather than
    scaly and which dries from the edge in. Only for those who can tell them
    apart with certainty.
