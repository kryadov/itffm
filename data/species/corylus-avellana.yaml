text:
  ru: >-
    Твёрдая гладкая скорлупа орешка выступает из зелёной, позже
    буреющей, рассечённой на лопасти обёртки — обёртка охватывает орех
    заметно больше, чем у жёлудя, иногда почти целиком. Растёт кустом,
    не деревом, часто подлеском в широколиственном или смешанном лесу.
    Орехи собирают в конце лета — начале осени, когда обёртка начинает
    буреть и подсыхать.
  en: >-
    A hard, smooth nutshell sits inside a green (later browning), lobed
    husk — the husk wraps the nut noticeably more than an acorn's cap does,
    sometimes almost entirely. Grows as a shrub, not a tree, often as
    understorey in broadleaf or mixed woods. Nuts are gathered in late
    summer to early autumn, as the husk starts to brown and dry.
