text:
  ru: >-
    Одна ягода на стебле — не кисть, как у черники или брусники, а сложная
    костянка размером с наперсток. Незрелая твёрдая и красная, спелая —
    мягкая, янтарно-жёлтая, почти прозрачная. Растёт только на верховом
    болоте, среди мха и пушицы, — вне этой почвы не встречается вовсе, и
    это самый надёжный признак, надёжнее самой ягоды.
  en: >-
    One berry per stem, not a cluster like bilberry or lingonberry — a
    compound drupe the size of a thimble. Firm and red unripe, soft amber and
    almost translucent when ripe. Grows only on raised sphagnum bog, among
    moss and cottongrass — absent from any other ground, which is the surer
    field mark than the berry itself.
