text:
  ru: >-
    Близкий родственник белого гриба, но узнаётся по тому, что делает с ним
    нож: бледно-жёлтая мякоть и трубчатый слой синеют на срезе за несколько
    секунд, чего белый гриб не делает никогда. Ножка также более гладкая, без
    заметной сетки. Обычен и надёжен на протяжении долгого сезона, вплоть до
    поздней осени.
  en: >-
    A close relative of the penny bun, told apart by what a knife does to it —
    the pale yellow flesh and pores both turn blue within seconds of being
    cut, something the penny bun never does. The stem is smoother too, lacking
    a raised net pattern. Common and reliable through a long season into late
    autumn.
