name:
  la: Imleria badia
  ru: Моховик каштановый
  en: Bay bolete
edibility: edible
lookalikes: [tylopilus-felleus]
morphology:
  cap:
    shape: hemispherical
    ageShape: convex
    diameter: [50, 150]
