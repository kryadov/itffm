text:
  ru: >-
    Целиком оранжевый, с концентрическими кругами на вдавленной липкой
    шляпке. При любом надрезе или надломе выделяет оранжевый млечный сок —
    это главная проверка для всего рода. С возрастом и от прикосновений
    постепенно зеленеет, хотя точный оттенок трудно передать словами. Растёт
    только под сосной и елью.
  en: >-
    Orange throughout, with concentric rings on a depressed, sticky cap. Any
    cut or bruise brings out an orange latex — the defining test for the whole
    genus. Slowly stains greenish with age and handling, a colour easier to
    see in the field than to describe. Found only under pine and spruce.
