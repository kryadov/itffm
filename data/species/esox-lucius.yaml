text:
  ru: >-
    Длинное, почти цилиндрическое тело оливково-бурого цвета с бледными
    пятнами, приплюснутая «утиная» голова с зубастой пастью — узнаётся
    издалека среди камышей, откуда она подстерегает добычу в одиночку. Крупная
    хищница, редко попадается там, где есть рыба помельче. Мясо белое и
    вкусное, но сырую или недоваренную щуку есть нельзя — она нередко
    заражена широким лентецом, поэтому её всегда готовят полностью
    прожаренной или проваренной.
  en: >-
    A long, almost cylindrical olive-brown body with pale blotches and a
    flattened, duck-billed head full of teeth — unmistakable lurking among
    reeds, where it ambushes prey alone rather than in a shoal. A large
    predator, seen only where smaller fish are already plentiful. The white
    flesh is good eating, but raw or undercooked pike is not safe — it is a
    known carrier of the broad fish tapeworm, so it is always cooked all the
    way through.
