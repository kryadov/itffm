id: omphalotus-olearius
gbifKey: 2538088
name:
  la: Omphalotus olearius
  ru: Омфалотус оливковый
  en: Jack-o'-lantern mushroom
edibility: poisonous
lookalikes: [cantharellus-cibarius]
morphology:
  cap:
    shape: convex
    ageShape: funnel
    diameter: [60, 150]
    color: "#e8631a"
    surface: smooth
    surfaceColor: "#e8631a"
  hymenium:
    type: gills
    attachment: decurrent
    color: "#e8631a"
  stipe:
    height: [60, 150]
    width: [10, 25]
    color: "#e8631a"
    position: central
    ring: none
    volva: none
  flesh:
    color: "#f0a45a"
    bruising: none
  latex: none
ecology:
  mycorrhizal: []
  substrate: deadwood
