media: []
text:
  ru: >-
    Ярко-оранжевый целиком, растёт крупными плотными пучками у основания
    лиственных деревьев и пней, с настоящими острыми пластинками, сбегающими
    на ножку, — в отличие от тупых складок лисички. Пластинки слабо светятся в
    темноте. Вызывает тяжёлое пищевое отравление.
  en: >-
    Brilliant orange throughout, growing in large dense clusters at the base
    of broadleaf trees and stumps, with true sharp-edged gills running down
    the stem — unlike the chanterelle's blunt ridges. The gills glow faintly
    in the dark. Causes severe gastrointestinal poisoning.
