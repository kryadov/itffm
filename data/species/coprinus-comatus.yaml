text:
  ru: >-
    Высокие белые цилиндры, лохматые от отогнутых чешуек, пробиваются сквозь
    газоны и обочины дорог, иногда прямо через асфальт. Собирать и готовить
    нужно, пока шляпка ещё белая и плотная: за сутки она растворяется в чёрные
    чернила снизу вверх — фокус, свойственный лишь этой небольшой группе
    видов. Хороший гриб для начала: ничего опасного не разделяет с ним эту
    форму и повадку.
  en: >-
    Tall white cylinders, shaggy with upturned scales, pushing up through
    lawns and roadside verges, sometimes through tarmac. Must be picked and
    cooked while the cap is still white and firm — within a day it dissolves
    into black ink from the rim upward, a trick unique to this small group of
    species. A good one to learn first: nothing dangerous shares this shape
    and habit.
