text:
  ru: >-
    Растёт черепитчатыми пучками на мёртвой лиственной древесине — пнях, валеже,
    старых тополях. Ножка короткая и сдвинута вбок, пластинки далеко сбегают на
    неё. Съедобна. Не микоризный гриб: искать надо не под деревом, а на дереве,
    и поздней осенью, когда всё остальное уже отошло.
  en: >-
    Grows in overlapping clusters on dead hardwood — stumps, fallen trunks, old
    poplars. The short stipe sits off to one side and the gills run far down it.
    Edible. Not mycorrhizal: look on the wood, not under the tree, and late in
    the year when little else is left.
