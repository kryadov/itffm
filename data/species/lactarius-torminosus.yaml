text:
  ru: >-
    Розовая шляпка с тёмными концентрическими кругами и мохнатым, «шерстяным»
    подвёрнутым краем; на изломе выступает едкий белый млечный сок, который
    не меняет цвет на воздухе. Растёт только под берёзами. Сырая или
    недоваренная вызывает тяжёлое расстройство желудка — латинское название
    значит «вызывающая колики». В России её едят только солёной, после долгого
    вымачивания и отваривания; во многих странах считается ядовитой.
  en: >-
    A pink cap ringed with darker bands, its rolled edge shaggy as wool;
    broken, it bleeds an acrid white milk that keeps its colour in the air. It
    grows only under birch. Raw or undercooked it causes violent stomach upset
    — the Latin name means "causing colic". In Russia and Finland it is eaten
    only salted, after long soaking and boiling twice; many countries simply
    count it poisonous.
