text:
  ru: >-
    Тонкая полая чёрно-бурая труба цвета тени среди опавших листьев, почти без
    отдельной шляпки и ножки — весь гриб представляет собой одну воронку от
    края до основания. Часто его проще найти по запаху, чем взглядом. Совсем
    не опасен, а невзрачность — его лучшая защита от путаницы с чем-либо
    ядовитым.
  en: >-
    A thin, hollow, blackish-brown trumpet the colour of a shadow among fallen
    leaves, with almost no separate cap and stem — the whole thing is one
    funnel from rim to base. Often easier to find by scent than by sight.
    Entirely harmless, and its very dullness is the best protection from being
    confused with anything dangerous.
