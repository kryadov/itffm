text:
  ru: >-
    Небольшая колючая рыбка, родственница окуня, но без его полос — вся в
    тёмных крапинах, со слившимися колючим и мягким спинными плавниками и
    слизистой кожей. Держится у дна. Мелкая и колючая, зато из ершей
    получается самая наваристая уха.
  en: >-
    A small spiny cousin of the perch without its bars — speckled all over
    with dark spots, its spiny and soft dorsal fins joined, its skin slimy. It
    keeps near the bottom. Small and prickly, but ruffe make the richest
    fish soup of all.
