text:
  ru: >-
    Зеленовато-жёлтый бок с пятью-девятью тёмными поперечными полосами,
    красновато-оранжевые брюшной и анальный плавники — окраску не спутать ни
    с одной другой рыбой пруда. Держится небольшими стайками у коряг, свай и
    зарослей у берега, дальше от чистой воды на середине. Мясо белое, плотное,
    без мелких костей в филе — одна из самых обычных рыб на любительской
    удочке.
  en: >-
    A greenish-yellow flank crossed by five to nine dark vertical bars, with
    reddish-orange pelvic and anal fins — a colouring no other pond fish
    shares. Keeps to small loose shoals around snags, posts and bankside
    growth rather than open water. White, firm-fleshed and easy to fillet
    without small bones — one of the most ordinary catches on a hook and
    line.
