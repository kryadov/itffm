name:
  la: Hygrophoropsis aurantiaca
  ru: Лисичка ложная
  en: False chanterelle
edibility: inedible
lookalikes: [cantharellus-cibarius]
morphology:
  cap:
    shape: convex
    ageShape: depressed
    diameter: [30, 80]
    color: "#d8641e"
