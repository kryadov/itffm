text:
  ru: >-
    Несмотря на название и общий оранжевый оттенок, это совершенно другой,
    не родственный лисичке гриб: настоящие тонкие пластинки, часто
    вильчато-ветвящиеся, а не тупые складки, цвет глубже и однороднее, ножка
    тоньше и нередко смещена от центра. Растёт на хвойной подстилке и
    гниющей древесине, а не на почве в связи с живым деревом. Не опасен
    всерьёз, но невкусен — если пластинки настоящие и легко отделяются
    ногтем, это не настоящая лисичка.
  en: >-
    Despite the name and the shared orange tone, this is an entirely
    unrelated species: true thin gills, often forking, rather than blunt
    ridges, a deeper and more uniform colour, and a thinner stem that is
    often off-centre. Grows on conifer litter and rotting wood rather than
    soil tied to a living tree's roots. Not seriously dangerous, but
    unpleasant — if the gills are real and easily separated with a
    fingernail, it isn't the true chanterelle.
