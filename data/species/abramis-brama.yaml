text:
  ru: >-
    Высокое, сильно сжатое с боков тело, бронзово-золотистое у крупных рыб и
    серебристое у молодых; спина горбатая, плавники тёмные, анальный плавник
    длинный. Держится стайками у дна тихих прудов и заводей, выдавая себя
    пузырьками. Вкусная, хотя и костистая рыба — классика вяленья.
  en: >-
    A tall, deeply compressed body, bronze-gold in big fish and silvery in
    young ones, a humped back, dark fins and a long anal fin. It keeps in
    shoals near the bottom of still ponds and backwaters, given away by
    streams of bubbles. Good eating though bony — a classic for drying.
