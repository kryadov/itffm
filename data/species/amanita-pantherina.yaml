name:
  la: Amanita pantherina
  ru: Мухомор пантерный
  en: Panther cap
edibility: poisonous
lookalikes: [amanita-muscaria, macrolepiota-procera]
morphology:
  cap:
    shape: convex
    ageShape: flat
    diameter: [50, 110]
    color: "#7a5a38"
    surface: warty
    surfaceColor: "#f4efe4"
  hymenium:
    type: gills
    attachment: free
    color: "#fbf8f0"
  stipe:
    height: [60, 120]
    width: [10, 18]
    color: "#f6f2e8"
    position: central
    ring: pendant
    volva: marginate
  flesh:
