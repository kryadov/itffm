media: []
text:
  ru: >-
    Шляпка бурая или оливково-коричневая, усеянная чисто-белыми хлопьями, край
    с короткими бороздками. Ножка белая, с тонким кольцом, а у основания —
    клубень с чётким валиком-«воротничком». Ядовит сильнее красного мухомора:
    те же иботеновая кислота и мусцимол вызывают возбуждение, спутанность и
    судороги, варка их не разрушает. Опасно путать с мухомором серо-розовым,
    у которого мякоть краснеет на изломе.
  en: >-
    A brown to olive-brown cap scattered with pure white flakes, its edge
    finely grooved; a white stem with a thin ring and a bulb at the base
    marked by a neat rolled rim. More toxic than the fly agaric: the same
    ibotenic acid and muscimol bring agitation, confusion and seizures, and
    cooking does not destroy them. Dangerous to mistake for the blusher,
    whose flesh turns pink where it is cut or nibbled.
