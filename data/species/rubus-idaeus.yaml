text:
  ru: >-
    Колючий кустарник выше пояса, заполоняющий вырубки, гари и опушки. Ягода
    — сборная из множества сочных костяночек, красная, легко снимается с
    белой конической цветоложи и остаётся внутри полой. Лесная малина мельче
    садовой, но гораздо душистее.
  en: >-
    A prickly shrub taller than your waist, filling clearings, burnt ground
    and woodland edges. The fruit is a cluster of juicy red drupelets that
    slips off its white conical core and stays hollow inside. Wild raspberries
    are smaller than garden ones but far more fragrant.
