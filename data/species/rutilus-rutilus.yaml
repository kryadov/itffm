text:
  ru: >-
    Серебристый бок, зеленовато-бурая спина, красноватая радужка глаза и
    такого же цвета брюшной и хвостовой плавники — самая обычная рыба
    небольших прудов и тихих заводей. Держится плотными стаями у поверхности
    в тёплые дни, мясо костистое, но традиционно едят — в засоленном или
    копчёном виде мелкие кости почти не мешают.
  en: >-
    A silvery flank, an olive-brown back, and a reddish iris matched by
    reddish pelvic and tail fins — the most ordinary fish of small ponds and
    still backwaters. Shoals tightly near the surface on warm days; the flesh
    is bony but traditionally eaten all the same — salted or smoked, the fine
    bones barely register.
