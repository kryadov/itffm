text:
  ru: >-
    Один из самых высоких грибов леса: лохматая бурая шляпка раскрывается
    плоским зонтом на верхушке ножки выше ладони, покрытой змеиным рисунком.
    Толстое кольцо свободно скользит вверх и вниз по ножке — в отличие от
    неподвижных или хрупких колец у мелких опасных родственников; всегда
    проверяйте это, прежде чем брать что-то похожее на маленький зонтик.
    Лучше всего жарить шляпку целиком, как отбивную.
  en: >-
    One of the tallest mushrooms in the wood: a shaggy brown cap opens flat
    like a parasol atop a snake-skin-patterned stem taller than a hand's span.
    The thick ring slides freely up and down the stem, unlike the fixed or
    fragile rings of smaller, riskier relatives — always slide the ring before
    eating anything that looks like a small parasol. Best cooked whole,
    breaded, like a cutlet.
