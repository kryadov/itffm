text:
  ru: >-
    Красновато-бурая шляпка сминается в бесформенные извилины, похожие на
    мозг, а не в ровные соты настоящего сморчка, и ножка внутри рыхлая,
    камерная, а не чисто полая. Растёт в тех же сосняках на песке и в те же
    недели ранней весны, что и сморчок, — самая опасная пара сезона. Содержит
    гиромитрин, родственный ракетному топливу; известны смертельные
    отравления. Не стоит риска, сколько бы раз ни отваривали.
  en: >-
    A reddish-brown cap crumpled into shapeless, brain-like folds rather than
    the true morel's neat honeycomb, with a stem that is loosely chambered
    inside rather than cleanly hollow. Fruits in the same sandy pine woods, in
    the same early-spring weeks, as the true morel — the most dangerous pair
    of the season. Contains gyromitrin, related to rocket fuel; fatalities are
    documented. Not worth the risk, however many times it is parboiled.
