text:
  ru: >-
    Золотисто-бурые пучки на погребённой древесине и старых пнях, шляпка
    молодого гриба искрится мельчайшими блёстками по росе — отсюда и название.
    Растёт на любой заглублённой древесине, включая старые деревянные крепи в
    заброшенных штольнях — редкий гриб, по-настоящему живущий под землёй.
    Съедобен только молодым и свежим; как и другие навозники, не сочетайте с
    алкоголем.
  en: >-
    Golden-brown tufts on buried wood and old stumps, the cap glistening with
    tiny flecks when fresh and dew-covered — hence the name. Grows on any
    buried timber, including the old wooden props still standing in disused
    mine adits — one of the few mushrooms genuinely at home underground.
    Edible only fresh and young; like other ink caps, best kept away from
    alcohol.
