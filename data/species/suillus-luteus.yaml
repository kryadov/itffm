text:
  ru: >-
    Скользкая каштаново-бурая шляпка и светло-жёлтый трубчатый слой появляются
    только рядом с сосной — в том числе в молодых посадках на прибрежных
    дюнах, которыми укрепляют песок. Плёнчатое кольцо на ножке — хороший
    ориентир. Перед готовкой снимите липкую кожицу со шляпки, иначе гриб может
    вызвать лёгкое расстройство желудка.
  en: >-
    A slimy chestnut-brown cap and pale yellow pores appear only near pine —
    including young plantations used to hold the sand on coastal dunes. A ring
    on the stem is a useful check. Peel the sticky skin before cooking; some
    people find it mildly upsetting otherwise.
