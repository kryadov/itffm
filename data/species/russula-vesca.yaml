text:
  ru: >-
    Шляпка розовато-буроватая, «ветчинного» цвета, и кожица на ней чуть не
    доходит до края, открывая белую мякоть и концы пластинок, — будто
    приоткрытые зубы. Пластинки и ножка белые, мякоть ломкая, как у всех
    сыроежек, вкус мягкий, ореховый. Одна из лучших сыроежек; от жгучих
    красных её отличает этот неострый вкус и приглушённый цвет.
  en: >-
    A pinkish-brown, ham-coloured cap whose skin stops just short of the edge,
    baring the white flesh and the gill ends like a glimpse of teeth. White
    gills and stem, flesh that snaps like every Russula's, and a mild, nutty
    taste. One of the best of its genus; the mild taste and muted colour tell
    it from the acrid red ones.
