text:
  ru: >-
    Медово-жёлтая головка с сотовым узором ямок и гребней, сросшаяся прямо с
    полой ножкой, — весь гриб хрупкий и полый насквозь. Один из первых грибов
    года, часто на гари прошлого сезона. Есть только после тщательной варки:
    сырой сморчок токсичен. Опасно похож на строчок — у настоящего сморчка
    ямки правильные и ровные, а не спутанные складки мозговидной формы.
  en: >-
    A honey-yellow head patterned with a honeycomb of pits and ridges, fused
    directly to a hollow stem — the whole mushroom is brittle and hollow
    throughout. One of the first mushrooms of the year, often on ground burned
    the previous season. Edible only after thorough cooking: raw morels are
    toxic. Dangerously similar to the false morel — a true morel's pits are
    regular and even, not the tangled, brain-like folds of its look-alike.
