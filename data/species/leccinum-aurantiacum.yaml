text:
  ru: >-
    Кирпично-оранжевая шляпка ярче и краснее, чем у подберёзовика, и ножка так
    же покрыта тёмными чешуйками. На срезе белая мякоть за несколько минут
    проходит путь от розового к серо-синему и наконец к чёрному — эффектная
    проверка. Как и подберёзовик, привязан к одному партнёру: искать только
    под осиной и тополем, больше нигде.
  en: >-
    A brick-orange cap, brighter and redder than the birch bolete's, on a stem
    roughened the same way with dark scales. Cut it and the white flesh runs
    through pink, then slate-blue, then black within minutes — a striking
    test. Like its birch-partnered relative, it is tied to one host alone:
    look under aspen and poplar, nowhere else.
