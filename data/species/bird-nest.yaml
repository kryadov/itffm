media: []
text:
  ru: >-
    Не вид, а находка: сплетённая из прутиков, травы и мха чашка,
    оставленная в развилке ветвей после гнездового сезона. Форма и
    материал выдают, какая птица её строила, но точный вид редко удаётся
    назвать наверняка — важнее сам факт, что здесь кто-то жил. Съедобности
    у находки нет, как и вопроса о ней.
  en: >-
    Not a species but a find: a cup woven from twigs, grass and moss, left in
    a branch fork after the nesting season. Its shape and material hint at
    which bird built it, but naming the exact species is rarely certain —
    what matters more is the fact that someone lived here. A find has no
    edibility, not even the question of it.
