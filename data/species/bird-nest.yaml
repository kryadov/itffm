id: bird-nest
name:
  la: Nidus avium
  ru: Птичье гнездо
  en: Bird's nest
kind: find
lookalikes: []
morphology:
  color: "#8a7050"
  size: [80, 150]
  material: "прутики и мох"
ecology:
  mycorrhizal: []
  substrate: livewood
  biomes: [forest-broadleaved, forest-mixed, forest-coniferous]
  season: [4, 5, 6, 9, 10]
  moisture: [0.2, 0.7]
