text:
  ru: >-
    Ярко-жёлтый или золотисто-оранжевый маслёнок с липкой, блестящей в сырую
    погоду шляпкой и жёлтым губчатым слоем снизу. На ножке — плёнчатое
    кольцо. Растёт только там, где есть лиственница, часто целыми вереницами
    вдоль посадок. Съедобен; с шляпки обычно снимают слизистую кожицу.
  en: >-
    A bright yellow to golden-orange bolete with a sticky cap that shines in
    wet weather and yellow pores underneath, and a membranous ring on the
    stem. It grows only where there is larch, often in long rows along a
    planting. Edible; the slimy cap skin is usually peeled off.
