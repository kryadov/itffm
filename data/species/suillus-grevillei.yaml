name:
  la: Suillus grevillei
  ru: Маслёнок лиственничный
  en: Larch bolete
edibility: edible
lookalikes: [suillus-luteus]
morphology:
  cap:
    shape: convex
    ageShape: flat
    diameter: [40, 100]
    color: "#e0a024"
    surface: viscid
    surfaceColor: "#d99a20"
  hymenium:
    type: pores
    attachment: adnate
