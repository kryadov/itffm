text:
  ru: >-
    Растёт только рядом с берёзой — от карликовой полярной берёзки в тундре до
    обычной берёзы в смешанном лесу — и больше нигде. Серо-бурая шляпка, белая
    мякоть, медленно чернеющая на срезе, и светлая ножка, вся в мелких тёмных
    чешуйках, как кора того дерева, под которым он растёт. Надёжный гриб для
    начала: у него нет опасных двойников с той же экологией.
  en: >-
    Found only near birch — from dwarf polar birch on the tundra to ordinary
    birch in mixed woodland — and nowhere else. A grey-brown cap, white flesh
    that slowly blackens when cut, and a pale stem roughened all over with
    small dark scales, like the bark of the tree it grows under. A reliable
    species to learn first: no dangerous look-alike shares its exact ecology.
