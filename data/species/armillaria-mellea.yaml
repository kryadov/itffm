media: []
text:
  ru: >-
    Плотные пучки медово-бурых грибов у основания живых и мёртвых деревьев,
    шляпка с мелкими тёмными чешуйками, плёнчатое кольцо на ножке, вольвы нет.
    Съедобен только после тщательной варки. На той же древесине растут
    смертельно ядовитая галерина окаймлённая и ядовитый ложноопёнок серно-
    жёлтый — не берите пучки с дерева без полной уверенности в виде.
  en: >-
    Dense honey-brown tufts at the base of living and dead trees, a cap with
    small dark scales, a membranous ring on the stem, no volva. Edible only
    after thorough cooking. The deadly funeral bell and the poisonous sulphur
    tuft grow in identical-looking clusters on the same wood — never pick a
    tufted cluster from a tree without complete certainty of the species.
