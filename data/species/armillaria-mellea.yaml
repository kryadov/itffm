id: armillaria-mellea
gbifKey: 5257997
name:
  la: Armillaria mellea
  ru: Опёнок осенний
  en: Honey fungus
edibility: conditional
lookalikes: [galerina-marginata, hypholoma-fasciculare]
morphology:
  cap:
    shape: convex
    ageShape: flat
    diameter: [30, 150]
