text:
  ru: >-
    Крупная белая слизистая воронка с мохнатым завёрнутым краем, из любого
    надреза обильно выделяется едкий белый млечный сок — в отличие от
    оранжевого сока рыжика. Растёт только с берёзой, часто большими группами.
    Традиционно едят только после многонедельного засола: свежим или
    недоваренным гриб остро едок и может расстроить желудок.
  en: >-
    A large white, slimy, funnel-shaped cap with a shaggy, inrolled rim,
    bleeding copious acrid white latex from any cut — unlike the orange latex
    of the saffron milk cap. Found only with birch, often in large troops.
    Traditionally eaten only after weeks of salting: fresh or undercooked it
    is sharply acrid and can upset the stomach.
