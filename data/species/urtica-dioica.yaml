text:
  ru: >-
    Опушённые стебли и супротивные зубчатые листья, покрытые жгучими
    волосками — узнаётся раньше на ощупь, чем на глаз, и это узнавание
    стоит запомнить. Молодые верхушечные листья, собранные до цветения,
    идут в суп и на щи — старые, огрубевшие, уже не годятся. Растёт
    сплошными зарослями там, где почва богата азотом: у жилья, на
    вырубках, по опушкам.
  en: >-
    Downy stems and toothed opposite leaves covered in stinging hairs —
    recognised by touch before sight, and that recognition is worth
    remembering the hard way. Young top leaves, picked before flowering, go
    into soup — older, coarsened ones no longer do. Grows in dense stands
    wherever the soil is nitrogen-rich: near dwellings, on clearings, along
    edges.
