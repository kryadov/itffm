text:
  ru: >-
    Гладкая оранжево-красная шляпка без белых бородавок — в этом главное
    отличие от мухомора красного. Ярко-жёлтые пластинки и ножка, плёнчатое
    кольцо и белый мешковидный вольва у основания. Ценный съедобный гриб юга
    Европы, но род Amanita остаётся самым опасным родом грибов: проверяйте
    каждый признак.
  en: >-
    A smooth orange-red cap with no white warts — the key difference from the
    fly agaric. Bright yellow gills and stem, a membranous ring, and a white
    sac-like volva at the base. A prized edible of southern Europe, but the
    genus Amanita remains the most dangerous of all: check every feature.
