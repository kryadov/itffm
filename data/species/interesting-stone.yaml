text:
  ru: >-
    Ничего конкретного — просто камень, который стоило поднять: необычная
    прожилка кварца, след окаменелости, форма, слишком правильная для
    случайности. Такие находки не определяются видом, как гриб или ягода,
    но ровно так же вознаграждают внимательный взгляд под ноги.
  en: >-
    Nothing specific — just a stone worth picking up: an odd quartz vein, a
    fossil trace, a shape too regular for chance. Finds like this aren't
    identified by species the way a mushroom or a berry is, but they reward
    an attentive look at the ground just the same.
