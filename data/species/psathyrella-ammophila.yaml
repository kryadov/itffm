text:
  ru: >-
    Единственный гриб, растущий только на песке — на погребённых, отмирающих
    корнях песколюба, который держит дюну на месте. Непримечательный бурый
    гриб в любом другом месте здесь, на открытом песке без единого дерева и
    подстилки, оказывается самой заметной находкой всей вылазки к морю.
  en: >-
    The one mushroom that grows nowhere but sand, feeding on the buried,
    decaying roots of marram grass that binds a dune together. An unremarkable
    brown mushroom anywhere else, but on open sand with no tree or leaf litter
    in sight, it becomes the whole point of interest on a walk along the
    coast.
