text:
  ru: >-
    Переверните шляпку — и определение сделано само собой: вместо пластинок
    или пор снизу свисают мягкие бледные шипики, как иглы ежа, легко
    стирающиеся пальцем. Ни один опасный гриб умеренного леса не имеет такого
    гименофора, что делает его одним из самых безопасных грибов для новичка.
    Мягкий ореховый вкус, хотя старые экземпляры горчат.
  en: >-
    Turn it over and the identification makes itself: instead of gills or
    pores, soft pale spines hang from the underside like a hedgehog's quills,
    brittle enough to rub off with a thumb. No dangerous species in temperate
    woodland shares this feature, making it one of the safest mushrooms for a
    beginner to learn. Mild and nutty, though older caps turn bitter.
