text:
  ru: >-
    Низкий, до колена, кустарничек со светло-зелёными ребристыми веточками —
    сам куст легко узнать ещё до ягод. Плоды почти чёрные с сизым восковым
    налётом, мякоть и сок ярко-фиолетовые (в отличие от голубики, у которой
    мякоть светлая) — это главный способ отличить их на вкус. Растёт сплошным
    подлеском в сыром хвойном лесу, часто рядом с брусникой, но на более
    влажной почве.
  en: >-
    A low, knee-high shrub with light-green ridged twigs, recognisable before
    a single berry shows. Nearly black fruit with a dusty bloom, and flesh and
    juice stained a deep violet-purple — unlike blueberry's pale flesh, this
    is the one taste test that tells them apart. Carpets the floor of damp
    coniferous woods, often alongside lingonberry but on wetter ground.
