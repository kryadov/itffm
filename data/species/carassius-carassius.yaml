text:
  ru: >-
    Высокий, почти круглый золотисто-бронзовый карась с длинным спинным
    плавником и крупной чешуёй. Самая неприхотливая рыба лесных прудов: живёт
    в заросших, бедных кислородом водоёмах, где другим не выжить, а зимой
    зарывается в ил. Вкусен жареным в сметане.
  en: >-
    A tall, almost round golden-bronze fish with a long dorsal fin and big
    scales. The hardiest fish of a forest pond: it lives in weedy,
    oxygen-poor water where others cannot, and in winter burrows into the
    mud. Good fried.
