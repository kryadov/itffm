text:
  ru: >-
    Целиком в оттенках фиолетового — шляпка, пластинки и ножка — пока молод; с
    возрастом бледнеет до тускло-бурого, из-за чего старые экземпляры легко
    пропустить или спутать. Один из последних грибов сезона, плодоносит после
    первых заморозков в опавшей листве, компостных кучах и садовой мульче.
    Готовить только тщательно проваренным; несколько похожих на вид
    родственников небезопасны.
  en: >-
    Violet all over — cap, gills and stem — when young, fading to a duller
    tan-brown with age, which makes older specimens much easier to overlook or
    misidentify. One of the last mushrooms of the year, fruiting after the
    first frosts in leaf litter, compost heaps and garden mulch. Cook only
    thoroughly; several similar-looking relatives are not safe.
