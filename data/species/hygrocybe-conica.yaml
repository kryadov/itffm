text:
  ru: >-
    Резко коническая оранжево-жёлтая шляпка на скрученной ножке — узнаётся по
    одному фокусу: тронь или просто подожди, и весь гриб, от шляпки до
    основания, почернеет с возрастом или от прикосновения. Растёт только на
    старых, никогда не удобрявшихся лугах — от равнинных пастбищ до
    высокогорья, и само его присутствие говорит о здоровье этого луга.
  en: >-
    A sharply conical orange-yellow cap on a twisted stem, identified by one
    trick: bruise it, or just wait, and the whole mushroom, cap to base, turns
    black with age or handling. Found only in old, unfertilised grassland,
    from lowland pasture up into alpine meadow — its presence alone marks a
    healthy, ancient grassland.
